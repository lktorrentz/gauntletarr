# Web and worker/scheduler run in the same container, managed by
# supervisord (see Dockerfile and docker/supervisord.conf) - a single
# docker-compose service.
#
# ./config is mounted as a DIRECTORY (not a file): if config/config.yaml
# doesn't exist on first start, the container creates it from
# config.example.yaml and starts anyway with default values. The app's
# own persistent state (SQLite database, poster cache) lives under this
# same mount by default (config.example.yaml's data_dir) - no separate
# volume needed for it.
#
# ./data below follows the TrashGuide convention: a single folder shared
# with your download client and media manager (torrents/ and media/ both
# under it), so hardlinks between them work. Point it at wherever your
# actual library + torrents live on the host. See config.example.yaml
# for disk_scan_root - it defaults to /data to match this layout.

services:
  gauntletarr:
    build: .
    container_name: gauntletarr
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./data:/data
